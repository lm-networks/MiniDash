services:
  minidash:
    build: .
    container_name: minidash
    restart: unless-stopped
    ports:
      - "${MINIDASH_PORT:-8080}:80"
    # Konsolę UniFi i konto admina ustawia kreator w przeglądarce (setup.php), a zmienia
    # strona "Konsola UniFi" w panelu. Konfiguracja trafia do wolumenu data, nie do zmiennych
    # środowiskowych - te widać w Container Managerze i w `docker inspect`.
    volumes:
      - minidash_data:/var/www/html/data
      - minidash_logs:/var/www/html/logs

volumes:
  minidash_data:
  minidash_logs:
