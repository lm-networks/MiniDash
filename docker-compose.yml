services:
  minidash:
    build: .
    container_name: minidash
    restart: unless-stopped
    ports:
      - "${MINIDASH_PORT:-8080}:80"
    # Optional: set these in a .env file next to this compose file to skip the Setup Wizard
    # (UNIFI_API_KEY and ADMIN_PASSWORD with min. 6 characters are required for that).
    # Left empty, the Setup Wizard appears in the browser. Used only on first start -
    # the configuration is then kept in the data volume.
    environment:
      - UNIFI_CONTROLLER_URL=${UNIFI_CONTROLLER_URL:-}
      - UNIFI_API_KEY=${UNIFI_API_KEY:-}
      - UNIFI_SITE=${UNIFI_SITE:-default}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - ADMIN_FULL_NAME=${ADMIN_FULL_NAME:-Admin}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@example.com}
      - DEBUG=${DEBUG:-false}
    volumes:
      - minidash_data:/var/www/html/data
      - minidash_logs:/var/www/html/logs

volumes:
  minidash_data:
  minidash_logs:
